<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Metodologías Cualitativas</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --page: linear-gradient(
                    to bottom right,
                    #faf5ff,
                    #f3e8ff,
                    #e9d5ff
                );
                --fg: #272755;
                --card: #fcfbff;
                --pri: #8267e2;
                --mut: #5f5f84;
                --bd: #dfdbf0;
                --acc: #e4e0fe;
                --ttl: #7c3aed;
                --hd: #fdfaffee;
                --sh: #8267e233;
                --ovb: #150a24b3;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            :root[data-theme="dark"] {
                --page: linear-gradient(
                    to bottom right,
                    #0f0a1a,
                    #1a0f28,
                    #150a24
                );
                --fg: #f2f0fb;
                --card: #0a071f;
                --pri: #9f87ff;
                --mut: #a39cc9;
                --bd: #2c2653;
                --acc: #2c2653;
                --ttl: #c4b5fd;
                --hd: #0a071fee;
                --sh: #000a;
            }
            * {
                box-sizing: border-box;
            }
            html {
                scroll-padding-top: env(safe-area-inset-top, 0px);
            }
            body {
                margin: 0;
                min-height: 100vh;
                background: #faf5ff;
                color: var(--fg);
                font:
                    400 15px/1.55 Inter,
                    ui-sans-serif,
                    system-ui,
                    sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            body::before {
                content: "";
                position: fixed;
                inset: 0;
                z-index: -1;
                background: var(--page);
            }
            button {
                font: inherit;
                color: inherit;
                cursor: pointer;
                border: 0;
                background: none;
                padding: 0;
            }
            :focus-visible {
                outline: 3px solid var(--pri);
                outline-offset: 2px;
            }
            h1,
            h2,
            h3,
            h4 {
                font-family: Poppins, Inter, sans-serif;
                margin: 0;
                text-wrap: balance;
            }
            .hd {
                position: sticky;
                top: 0;
                z-index: 40;
                background: var(--hd);
                border-bottom: 1px solid var(--bd);
            }
            .wrap {
                max-width: 80rem;
                margin: 0 auto;
                padding: 0 1rem;
            }
            .hd .wrap {
                display: flex;
                justify-content: space-between;
                gap: 1rem;
                align-items: flex-start;
                padding-top: 1.4rem;
                padding-bottom: 1.4rem;
            }
            .hd h1 {
                font-size: clamp(1.7rem, 4vw, 3rem);
                color: var(--ttl);
                display: flex;
                gap: 0.7rem;
                align-items: center;
            }
            .hd p {
                margin: 0.4rem 0 0;
                color: var(--ttl);
                font-weight: 500;
            }
            .ib {
                width: 2.25rem;
                height: 2.25rem;
                flex: none;
                border-radius: 0.6rem;
                border: 1px solid var(--bd);
                background: var(--card);
                display: grid;
                place-items: center;
            }
            svg.i {
                width: 1.2rem;
                height: 1.2rem;
                fill: none;
                stroke: currentColor;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .srch {
                margin: 1.6rem 0;
            }
            .srch input {
                width: 100%;
                height: 3.5rem;
                border: 1px solid transparent;
                border-radius: 1rem;
                padding: 0 1.2rem;
                font: inherit;
                font-size: 1rem;
                background: var(--card);
                color: var(--fg);
                box-shadow: 0 10px 30px var(--sh);
            }
            .srch input:focus {
                outline: none;
                box-shadow:
                    0 10px 30px var(--sh),
                    0 0 0 3px var(--pri);
            }
            .grid {
                display: grid;
                gap: 1.2rem;
                grid-template-columns: repeat(
                    auto-fit,
                    minmax(min(100%, 21rem), 1fr)
                );
            }
            .fam {
                margin: 0 0 2.4rem;
            }
            .fam-t {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                font-size: 1.5rem;
                margin: 0 0 0.3rem;
                padding-bottom: 0.5rem;
                border-bottom: 3px solid var(--c);
                color: var(--c);
            }
            .fam-t::before {
                content: "";
                width: 0.9rem;
                height: 0.9rem;
                border-radius: 0.3rem;
                background: var(--c);
            }
            .sub-t {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                font-size: 1.05rem;
                margin: 1.4rem 0 0.8rem;
                color: var(--c);
            }
            .sub-t::before {
                content: "";
                width: 0.6rem;
                height: 0.6rem;
                border-radius: 0.2rem;
                background: var(--c);
            }
            .lv {
                position: relative;
                overflow: hidden;
                text-align: left;
                border-radius: 1.5rem;
                padding: 1.8rem;
                color: #f3e8ff;
                text-shadow: 0 1px 3px #000c;
                border: 2px solid var(--c);
                background: var(--c);
                box-shadow: 0 10px 40px
                    color-mix(in srgb, var(--c) 28%, transparent);
                transition: transform 0.2s;
            }
            .lv:hover {
                transform: scale(1.02);
            }
            .lv:before {
                content: "";
                position: absolute;
                top: 0;
                right: 0;
                width: 8rem;
                height: 8rem;
                opacity: 0.2;
                background: radial-gradient(circle, #fff, transparent 70%);
            }
            .lv .tile {
                width: 5rem;
                height: 5rem;
                border-radius: 1rem;
                background: #fff3;
                display: grid;
                place-items: center;
                margin-bottom: 1.2rem;
            }
            .lv h2 {
                font-size: 1.7rem;
            }
            .lv p {
                margin: 0.6rem 0 1.1rem;
                font-size: 1.02rem;
            }
            .bdg {
                display: inline-block;
                background: #fff3;
                border: 1px solid #fff5;
                border-radius: 0.5rem;
                padding: 0.2rem 1rem;
                font-weight: 600;
                font-size: 0.9rem;
                text-shadow: none;
            }
            .pills {
                display: flex;
                flex-wrap: wrap;
                gap: 0.35rem;
                align-items: center;
                margin: 0 0 1.3rem;
            }
            .pills > i {
                font-style: normal;
                color: var(--mut);
            }
            .pl {
                display: inline-flex;
                border-radius: 99px;
                padding: 0.28rem 0.95rem;
                font-weight: 600;
                font-size: 0.85rem;
                background: var(--c, var(--pri));
                color: #f3e8ff;
                text-shadow: 0 1px 3px #0009;
                border: 1px solid #fff5;
            }
            button.pl:hover {
                filter: brightness(1.1);
            }
            .mc {
                display: flex;
                flex-direction: column;
                gap: 0.7rem;
                text-align: left;
                background: var(--card);
                border: 1px solid var(--bd);
                border-left: 6px solid var(--c);
                border-radius: 1.2rem;
                padding: 1rem;
                transition:
                    transform 0.2s,
                    box-shadow 0.2s;
                content-visibility: auto;
                contain-intrinsic-size: auto 125px;
            }
            .mc:hover {
                transform: translateY(-3px);
                box-shadow: 0 14px 30px var(--sh);
            }
            .mc .top {
                display: flex;
                gap: 0.8rem;
                align-items: center;
            }
            .mc h3 {
                font-size: 1rem;
                line-height: 1.25;
            }
            .mc small {
                color: var(--mut);
            }
            .th {
                flex: none;
                width: 3.4rem;
                height: 3.4rem;
                border-radius: 0.9rem;
                background: var(--acc);
                overflow: hidden;
                display: grid;
                place-items: center;
            }
            .th img,
            .th svg {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .th svg {
                padding: 0.3rem;
            }
            .bar {
                display: flex;
                height: 0.5rem;
                border-radius: 99px;
                overflow: hidden;
                background: var(--acc);
            }
            .bar i {
                display: block;
                height: 100%;
            }
            .bar.big {
                height: 0.7rem;
            }
            .meta {
                display: flex;
                justify-content: space-between;
                color: var(--mut);
                font-size: 0.78rem;
            }
            .none,
            .err {
                color: var(--mut);
                padding: 3rem 1rem;
                text-align: center;
            }
            .err {
                max-width: 36rem;
                margin: 2rem auto;
                border: 1px dashed var(--pri);
                border-radius: 1.2rem;
            }
            /* overlay */
            .ov {
                position: fixed;
                inset: 0;
                z-index: 60;
                background: var(--ovb);
                display: none;
                overflow: auto;
                padding: calc(1rem + env(safe-area-inset-top, 0px)) 0.8rem
                    calc(1rem + env(safe-area-inset-bottom, 0px));
            }
            .ov.open {
                display: block;
            }
            .sheet {
                max-width: 58rem;
                margin: 0 auto;
                background: var(--card);
                border: 1px solid var(--bd);
                border-radius: 1.8rem;
                padding: clamp(1rem, 3vw, 1.6rem);
                box-shadow: 0 20px 60px #0005;
            }
            .sh-top {
                display: flex;
                justify-content: space-between;
                gap: 1rem;
                align-items: flex-start;
            }
            .ttl {
                display: flex;
                gap: 0.9rem;
                align-items: center;
            }
            .ttl h2 {
                font-size: clamp(1.4rem, 3vw, 2rem);
                color: var(--ttl);
            }
            .two {
                display: grid;
                gap: 1rem;
                grid-template-columns: 1fr;
                margin: 1.2rem 0;
            }
            .ideal {
                border-radius: 1.3rem;
                padding: 1.1rem 1.25rem;
                background: linear-gradient(
                    135deg,
                    color-mix(in srgb, var(--pri) 16%, var(--card)),
                    var(--card)
                );
                border: 1px solid var(--bd);
            }
            .ideal h3 {
                font-size: 1rem;
                color: var(--ttl);
                margin-bottom: 0.4rem;
            }
            .ideal p {
                margin: 0;
            }
            .st-t {
                font-weight: 600;
                line-height: 1.35;
            }
            .st-a {
                color: var(--mut);
                font-size: 0.85rem;
                margin: 0.3rem 0 0.7rem !important;
            }
            .pat {
                font-size: 0.85rem;
                line-height: 1.4;
                color: var(--ttl);
                margin: 0 0 0.7rem !important;
                padding: 0.55rem 0.7rem;
                border-left: 3px solid var(--pri);
                background: var(--bg2, transparent);
                border-radius: 0.4rem;
            }
            .note {
                margin-top: 0.6rem !important;
                font-size: 0.78rem;
                color: var(--mut);
            }
            .note {
                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .lnk {
                display: inline-flex;
                gap: 0.4rem;
                background: var(--pri);
                color: #fff;
                border-radius: 0.7rem;
                padding: 0.4rem 0.9rem;
                font-weight: 600;
                font-size: 0.85rem;
                text-decoration: none;
            }
            .cf {
                font-size: 0.72rem;
                font-weight: 600;
                border-radius: 99px;
                padding: 0.12rem 0.55rem;
                margin-left: 0.4rem;
            }
            .cf.alta {
                background: #10b98126;
                color: #059669;
            }
            .cf.media {
                background: #f59e0b26;
                color: #d97706;
            }
            .cf.baja {
                background: #ef444426;
                color: #dc2626;
            }
            .fb {
                border: 1px solid var(--bd);
                border-radius: 1.3rem;
                padding: 1rem 0 0.4rem;
                overflow: hidden;
            }
            .fb h3 {
                font-size: 1.15rem;
                color: var(--ttl);
                padding: 0 1.1rem;
            }
            .chips {
                display: flex;
                gap: 0.4rem;
                flex-wrap: wrap;
                margin: 0.6rem 1.1rem;
            }
            .lab {
                margin: 0.6rem 1.1rem 0;
                font-size: 0.72rem;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--mut);
                font-weight: 600;
            }
            .sg {
                display: inline-flex;
                gap: 0.35rem;
                align-items: center;
                font-size: 0.78rem;
                font-weight: 600;
            }
            .sg i {
                width: 0.7rem;
                height: 0.7rem;
                border-radius: 3px;
                background: var(--c);
            }
            .sg b {
                opacity: 0.7;
            }
            .chip {
                display: inline-flex;
                gap: 0.4rem;
                align-items: center;
                border: 1.5px solid
                    color-mix(in srgb, var(--c) 55%, transparent);
                background: color-mix(in srgb, var(--c) 12%, var(--card));
                border-radius: 99px;
                padding: 0.18rem 0.7rem;
                font-size: 0.78rem;
                font-weight: 600;
            }
            .chip i {
                width: 0.55rem;
                height: 0.55rem;
                border-radius: 50%;
                background: var(--c);
            }
            .chip b {
                opacity: 0.7;
            }
            button.chip:hover {
                background: color-mix(in srgb, var(--c) 25%, var(--card));
            }
            .chip.on {
                background: var(--c);
                color: #fff;
                border-color: var(--c);
            }
            .chip.on i {
                background: #fff;
            }
            .cap {
                font-size: 0.78rem;
                color: var(--mut);
                margin: 0.2rem 1.1rem 0;
            }
            .warn {
                margin: 0.6rem 1.1rem 0;
                font-size: 0.78rem;
                padding: 0.4rem 0.7rem;
                border-radius: 0.7rem;
                background: #f59e0b1f;
                color: #b45309;
            }
            .bar.big {
                margin: 0.6rem 1.1rem 0;
            }
            .track {
                display: flex;
                align-items: flex-start;
                overflow-x: auto;
                padding: 1.1rem 1.1rem 1.3rem;
            }
            .node,
            .col {
                flex: none;
            }
            .node {
                width: 11.5rem;
                background: var(--card);
                border: 1.5px dashed var(--pri);
                border-radius: 1.2rem;
                padding: 0.8rem;
            }
            .node h4,
            .ch b {
                font-size: 0.9rem;
            }
            .node p {
                font-size: 0.75rem;
                color: var(--mut);
                margin: 0.2rem 0 0.5rem;
            }
            .node .chips {
                margin: 0;
                flex-direction: column;
                align-items: stretch;
            }
            .node .chip {
                justify-content: space-between;
            }
            .arr {
                flex: none;
                width: 2.2rem;
                height: 1rem;
                margin-top: 1.1rem;
            }
            .arr path {
                fill: none;
                stroke: var(--pri);
                stroke-width: 2.4;
                stroke-linecap: round;
                stroke-dasharray: 5 5;
                animation: dash 1s linear infinite;
            }
            .col {
                min-width: 8.6rem;
                max-width: 13.5rem;
            }
            .ch {
                border-radius: 0.9rem;
                padding: 0.5rem 0.8rem;
                background: var(--c);
                color: #fff;
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 0.6rem;
                text-shadow: 0 1px 2px #0005;
            }
            .ch small {
                font-size: 0.75rem;
                opacity: 0.9;
            }
            .dots {
                display: flex;
                flex-wrap: wrap;
                gap: 0.4rem;
                margin-top: 0.6rem;
                padding: 0 0.1rem;
            }
            .dot {
                position: relative;
                width: 2rem;
                height: 2rem;
                border-radius: 50%;
                background: var(--c);
                color: #fff;
                font-size: 0.74rem;
                font-weight: 700;
                text-shadow: 0 0 2px #0007;
                display: grid;
                place-items: center;
                transition: transform 0.12s;
            }
            .dot:hover,
            .dot:focus-visible {
                transform: scale(1.18);
            }
            .dot.off {
                opacity: 0.18;
            }
            .dot.hd::after {
                content: "";
                position: absolute;
                right: -3px;
                top: -3px;
                width: 0.65rem;
                height: 0.65rem;
                border-radius: 50%;
                background: var(--d);
                border: 2px solid var(--card);
            }
            .loop {
                flex: none;
                display: flex;
                align-items: flex-start;
                background: color-mix(in srgb, var(--pri) 9%, var(--card));
                border: 2px solid
                    color-mix(in srgb, var(--pri) 28%, transparent);
                border-radius: 1.5rem;
                padding: 1.9rem 0.7rem 0.7rem;
                position: relative;
            }
            .loop > .ll {
                position: absolute;
                top: 0.5rem;
                right: 1rem;
                color: var(--pri);
                font-weight: 700;
                font-size: 0.78rem;
            }
            .lo {
                width: 1.8rem;
                margin: 2rem 0.2rem 0;
                flex: none;
            }
            .lo path {
                fill: none;
                stroke: var(--pri);
                stroke-width: 2.4;
                stroke-linecap: round;
            }
            #tip {
                position: fixed;
                left: 0;
                top: 0;
                z-index: 80;
                display: none;
                pointer-events: none;
                width: max-content;
                max-width: min(21rem, calc(100vw - 16px));
                background: var(--card);
                color: var(--fg);
                border: 1.5px solid var(--bd);
                border-radius: 1rem;
                padding: 0.75rem 0.9rem;
                box-shadow: 0 14px 40px #0006;
                font-size: 0.82rem;
            }
            #tip .tt {
                color: var(--mut);
                margin-bottom: 0.3rem;
            }
            #tip p {
                margin: 0 0 0.5rem;
                line-height: 1.45;
            }
            #tip .chips {
                margin: 0;
            }
            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }
            @keyframes dash {
                to {
                    stroke-dashoffset: -20;
                }
            }
            .go .node,
            .go .col,
            .go .loop {
                opacity: 0;
                animation: rise 0.45s ease-out forwards;
                animation-delay: calc(var(--i) * 110ms);
            }
            @media (max-width: 700px) {
                .two {
                    grid-template-columns: 1fr;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                * {
                    animation: none !important;
                    transition: none !important;
                }
                .go .node,
                .go .col,
                .go .loop {
                    opacity: 1;
                }
            }
        </style>
    </head>
    <body>
        <header class="hd">
            <div class="wrap">
                <div>
                    <h1>
                        <svg
                            class="i"
                            style="width: 2rem; height: 2rem"
                            viewBox="0 0 24 24"
                        >
                            <path
                                d="M9.9 15.5A2 2 0 0 0 8.5 14l-6.1-1.5a.5.5 0 0 1 0-1L8.5 10A2 2 0 0 0 9.9 8.5l1.6-6.1a.5.5 0 0 1 1 0L14 8.5A2 2 0 0 0 15.5 10l6.1 1.5a.5.5 0 0 1 0 1L15.5 14a2 2 0 0 0-1.4 1.5l-1.6 6.1a.5.5 0 0 1-1 0z"
                            /></svg
                        >Metodologías Cualitativas
                    </h1>
                    <p>
                        Explora <span id="nmet">48</span> métodos especializados
                        de análisis cualitativo
                    </p>
                </div>
                <button class="ib" id="th" aria-label="Cambiar tema"></button>
            </div>
        </header>
        <main class="wrap">
            <div class="srch">
                <input
                    id="q"
                    placeholder="Buscar métodos por nombre, descripción o propósito..."
                    aria-label="Buscar"
                />
            </div>
            <div id="view"></div>
        </main>
        <div class="ov" id="ov" role="dialog" aria-modal="true">
            <div class="sheet" id="sheet"></div>
        </div>
        <div id="tip" role="tooltip"></div>
        <script>
            const D = /*DATA*/ null;
        </script>
        <script src="app.js"></script>
    </body>
</html>
