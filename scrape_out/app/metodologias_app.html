<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Metodologías Cualitativas</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --page: linear-gradient(
                    to bottom right,
                    #faf5ff,
                    #f3e8ff,
                    #e9d5ff
                );
                --fg: #272755;
                --card: #fcfbff;
                --pri: #8267e2;
                --mut: #5f5f84;
                --bd: #dfdbf0;
                --acc: #e4e0fe;
                --ttl: #7c3aed;
                --hd: #fdfaffee;
                --sh: #8267e233;
                --ovb: #150a24b3;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --page: linear-gradient(
                        to bottom right,
                        #0f0a1a,
                        #1a0f28,
                        #150a24
                    );
                    --fg: #f2f0fb;
                    --card: #0a071f;
                    --pri: #9f87ff;
                    --mut: #a39cc9;
                    --bd: #2c2653;
                    --acc: #2c2653;
                    --ttl: #c4b5fd;
                    --hd: #0a071fee;
                    --sh: #000a;
                }
            }
            :root[data-theme="dark"] {
                --page: linear-gradient(
                    to bottom right,
                    #0f0a1a,
                    #1a0f28,
                    #150a24
                );
                --fg: #f2f0fb;
                --card: #0a071f;
                --pri: #9f87ff;
                --mut: #a39cc9;
                --bd: #2c2653;
                --acc: #2c2653;
                --ttl: #c4b5fd;
                --hd: #0a071fee;
                --sh: #000a;
            }
            * {
                box-sizing: border-box;
            }
            html {
                scroll-padding-top: env(safe-area-inset-top, 0px);
            }
            body {
                margin: 0;
                min-height: 100vh;
                background: #faf5ff;
                color: var(--fg);
                font:
                    400 15px/1.55 Inter,
                    ui-sans-serif,
                    system-ui,
                    sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            body::before {
                content: "";
                position: fixed;
                inset: 0;
                z-index: -1;
                background: var(--page);
            }
            button {
                font: inherit;
                color: inherit;
                cursor: pointer;
                border: 0;
                background: none;
                padding: 0;
            }
            :focus-visible {
                outline: 3px solid var(--pri);
                outline-offset: 2px;
            }
            h1,
            h2,
            h3,
            h4 {
                font-family: Poppins, Inter, sans-serif;
                margin: 0;
                text-wrap: balance;
            }
            .hd {
                position: sticky;
                top: 0;
                z-index: 40;
                background: var(--hd);
                border-bottom: 1px solid var(--bd);
            }
            .wrap {
                max-width: 80rem;
                margin: 0 auto;
                padding: 0 1rem;
            }
            .hd .wrap {
                display: flex;
                justify-content: space-between;
                gap: 1rem;
                align-items: flex-start;
                padding-top: 1.4rem;
                padding-bottom: 1.4rem;
            }
            .hd h1 {
                font-size: clamp(1.7rem, 4vw, 3rem);
                color: var(--ttl);
                display: flex;
                gap: 0.7rem;
                align-items: center;
            }
            .hd p {
                margin: 0.4rem 0 0;
                color: var(--ttl);
                font-weight: 500;
            }
            .ib {
                width: 2.25rem;
                height: 2.25rem;
                flex: none;
                border-radius: 0.6rem;
                border: 1px solid var(--bd);
                background: var(--card);
                display: grid;
                place-items: center;
            }
            svg.i {
                width: 1.2rem;
                height: 1.2rem;
                fill: none;
                stroke: currentColor;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .srch {
                margin: 1.6rem 0;
            }
            .srch input {
                width: 100%;
                height: 3.5rem;
                border: 1px solid transparent;
                border-radius: 1rem;
                padding: 0 1.2rem;
                font: inherit;
                font-size: 1rem;
                background: var(--card);
                color: var(--fg);
                box-shadow: 0 10px 30px var(--sh);
            }
            .srch input:focus {
                outline: none;
                box-shadow:
                    0 10px 30px var(--sh),
                    0 0 0 3px var(--pri);
            }
            .grid {
                display: grid;
                gap: 1.2rem;
                grid-template-columns: repeat(
                    auto-fit,
                    minmax(min(100%, 21rem), 1fr)
                );
            }
            .lv {
                position: relative;
                overflow: hidden;
                text-align: left;
                border-radius: 1.5rem;
                padding: 1.8rem;
                color: #f3e8ff;
                text-shadow: 0 1px 3px #000c;
                border: 2px solid var(--c);
                background: var(--c);
                box-shadow: 0 10px 40px
                    color-mix(in srgb, var(--c) 28%, transparent);
                transition: transform 0.2s;
            }
            .lv:hover {
                transform: scale(1.02);
            }
            .lv:before {
                content: "";
                position: absolute;
                top: 0;
                right: 0;
                width: 8rem;
                height: 8rem;
                opacity: 0.2;
                background: radial-gradient(circle, #fff, transparent 70%);
            }
            .lv .tile {
                width: 5rem;
                height: 5rem;
                border-radius: 1rem;
                background: #fff3;
                display: grid;
                place-items: center;
                margin-bottom: 1.2rem;
            }
            .lv h2 {
                font-size: 1.7rem;
            }
            .lv p {
                margin: 0.6rem 0 1.1rem;
                font-size: 1.02rem;
            }
            .bdg {
                display: inline-block;
                background: #fff3;
                border: 1px solid #fff5;
                border-radius: 0.5rem;
                padding: 0.2rem 1rem;
                font-weight: 600;
                font-size: 0.9rem;
                text-shadow: none;
            }
            .pills {
                display: flex;
                flex-wrap: wrap;
                gap: 0.35rem;
                align-items: center;
                margin: 0 0 1.3rem;
            }
            .pills > i {
                font-style: normal;
                color: var(--mut);
            }
            .pl {
                display: inline-flex;
                border-radius: 99px;
                padding: 0.28rem 0.95rem;
                font-weight: 600;
                font-size: 0.85rem;
                background: var(--c, var(--pri));
                color: #f3e8ff;
                text-shadow: 0 1px 3px #0009;
                border: 1px solid #fff5;
            }
            button.pl:hover {
                filter: brightness(1.1);
            }
            .mc {
                display: flex;
                flex-direction: column;
                gap: 0.7rem;
                text-align: left;
                background: var(--card);
                border: 1px solid var(--bd);
                border-left: 6px solid var(--c);
                border-radius: 1.2rem;
                padding: 1rem;
                transition:
                    transform 0.2s,
                    box-shadow 0.2s;
                content-visibility: auto;
                contain-intrinsic-size: auto 125px;
            }
            .mc:hover {
                transform: translateY(-3px);
                box-shadow: 0 14px 30px var(--sh);
            }
            .mc .top {
                display: flex;
                gap: 0.8rem;
                align-items: center;
            }
            .mc h3 {
                font-size: 1rem;
                line-height: 1.25;
            }
            .mc small {
                color: var(--mut);
            }
            .th {
                flex: none;
                width: 3.4rem;
                height: 3.4rem;
                border-radius: 0.9rem;
                background: var(--acc);
                overflow: hidden;
                display: grid;
                place-items: center;
            }
            .th img,
            .th svg {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .th svg {
                padding: 0.3rem;
            }
            .bar {
                display: flex;
                height: 0.5rem;
                border-radius: 99px;
                overflow: hidden;
                background: var(--acc);
            }
            .bar i {
                display: block;
                height: 100%;
            }
            .bar.big {
                height: 0.7rem;
            }
            .meta {
                display: flex;
                justify-content: space-between;
                color: var(--mut);
                font-size: 0.78rem;
            }
            .none,
            .err {
                color: var(--mut);
                padding: 3rem 1rem;
                text-align: center;
            }
            .err {
                max-width: 36rem;
                margin: 2rem auto;
                border: 1px dashed var(--pri);
                border-radius: 1.2rem;
            }
            /* overlay */
            .ov {
                position: fixed;
                inset: 0;
                z-index: 60;
                background: var(--ovb);
                display: none;
                overflow: auto;
                padding: calc(1rem + env(safe-area-inset-top, 0px)) 0.8rem
                    calc(1rem + env(safe-area-inset-bottom, 0px));
            }
            .ov.open {
                display: block;
            }
            .sheet {
                max-width: 58rem;
                margin: 0 auto;
                background: var(--card);
                border: 1px solid var(--bd);
                border-radius: 1.8rem;
                padding: clamp(1rem, 3vw, 1.6rem);
                box-shadow: 0 20px 60px #0005;
            }
            .sh-top {
                display: flex;
                justify-content: space-between;
                gap: 1rem;
                align-items: flex-start;
            }
            .ttl {
                display: flex;
                gap: 0.9rem;
                align-items: center;
            }
            .ttl h2 {
                font-size: clamp(1.4rem, 3vw, 2rem);
                color: var(--ttl);
            }
            .two {
                display: grid;
                gap: 1rem;
                grid-template-columns: 1fr;
                margin: 1.2rem 0;
            }
            .ideal {
                border-radius: 1.3rem;
                padding: 1.1rem 1.25rem;
                background: linear-gradient(
                    135deg,
                    color-mix(in srgb, var(--pri) 16%, var(--card)),
                    var(--card)
                );
                border: 1px solid var(--bd);
            }
            .ideal h3 {
                font-size: 1rem;
                color: var(--ttl);
                margin-bottom: 0.4rem;
            }
            .ideal p {
                margin: 0;
            }
            .st-t {
                font-weight: 600;
                line-height: 1.35;
            }
            .st-a {
                color: var(--mut);
                font-size: 0.85rem;
                margin: 0.3rem 0 0.7rem !important;
            }
            .note {
                margin-top: 0.6rem !important;
                font-size: 0.78rem;
                color: var(--mut);
            }
            .note {
                display: -webkit-box;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .lnk {
                display: inline-flex;
                gap: 0.4rem;
                background: var(--pri);
                color: #fff;
                border-radius: 0.7rem;
                padding: 0.4rem 0.9rem;
                font-weight: 600;
                font-size: 0.85rem;
                text-decoration: none;
            }
            .cf {
                font-size: 0.72rem;
                font-weight: 600;
                border-radius: 99px;
                padding: 0.12rem 0.55rem;
                margin-left: 0.4rem;
            }
            .cf.alta {
                background: #10b98126;
                color: #059669;
            }
            .cf.media {
                background: #f59e0b26;
                color: #d97706;
            }
            .cf.baja {
                background: #ef444426;
                color: #dc2626;
            }
            .fb {
                border: 1px solid var(--bd);
                border-radius: 1.3rem;
                padding: 1rem 0 0.4rem;
                overflow: hidden;
            }
            .fb h3 {
                font-size: 1.15rem;
                color: var(--ttl);
                padding: 0 1.1rem;
            }
            .chips {
                display: flex;
                gap: 0.4rem;
                flex-wrap: wrap;
                margin: 0.6rem 1.1rem;
            }
            .lab {
                margin: 0.6rem 1.1rem 0;
                font-size: 0.72rem;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--mut);
                font-weight: 600;
            }
            .sg {
                display: inline-flex;
                gap: 0.35rem;
                align-items: center;
                font-size: 0.78rem;
                font-weight: 600;
            }
            .sg i {
                width: 0.7rem;
                height: 0.7rem;
                border-radius: 3px;
                background: var(--c);
            }
            .sg b {
                opacity: 0.7;
            }
            .chip {
                display: inline-flex;
                gap: 0.4rem;
                align-items: center;
                border: 1.5px solid
                    color-mix(in srgb, var(--c) 55%, transparent);
                background: color-mix(in srgb, var(--c) 12%, var(--card));
                border-radius: 99px;
                padding: 0.18rem 0.7rem;
                font-size: 0.78rem;
                font-weight: 600;
            }
            .chip i {
                width: 0.55rem;
                height: 0.55rem;
                border-radius: 50%;
                background: var(--c);
            }
            .chip b {
                opacity: 0.7;
            }
            button.chip:hover {
                background: color-mix(in srgb, var(--c) 25%, var(--card));
            }
            .chip.on {
                background: var(--c);
                color: #fff;
                border-color: var(--c);
            }
            .chip.on i {
                background: #fff;
            }
            .cap {
                font-size: 0.78rem;
                color: var(--mut);
                margin: 0.2rem 1.1rem 0;
            }
            .warn {
                margin: 0.6rem 1.1rem 0;
                font-size: 0.78rem;
                padding: 0.4rem 0.7rem;
                border-radius: 0.7rem;
                background: #f59e0b1f;
                color: #b45309;
            }
            .bar.big {
                margin: 0.6rem 1.1rem 0;
            }
            .track {
                display: flex;
                align-items: flex-start;
                overflow-x: auto;
                padding: 1.1rem 1.1rem 1.3rem;
            }
            .node,
            .col {
                flex: none;
            }
            .node {
                width: 11.5rem;
                background: var(--card);
                border: 1.5px dashed var(--pri);
                border-radius: 1.2rem;
                padding: 0.8rem;
            }
            .node h4,
            .ch b {
                font-size: 0.9rem;
            }
            .node p {
                font-size: 0.75rem;
                color: var(--mut);
                margin: 0.2rem 0 0.5rem;
            }
            .node .chips {
                margin: 0;
                flex-direction: column;
                align-items: stretch;
            }
            .node .chip {
                justify-content: space-between;
            }
            .arr {
                flex: none;
                width: 2.2rem;
                height: 1rem;
                margin-top: 1.1rem;
            }
            .arr path {
                fill: none;
                stroke: var(--pri);
                stroke-width: 2.4;
                stroke-linecap: round;
                stroke-dasharray: 5 5;
                animation: dash 1s linear infinite;
            }
            .col {
                min-width: 8.6rem;
                max-width: 13.5rem;
            }
            .ch {
                border-radius: 0.9rem;
                padding: 0.5rem 0.8rem;
                background: var(--c);
                color: #fff;
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 0.6rem;
                text-shadow: 0 1px 2px #0005;
            }
            .ch small {
                font-size: 0.75rem;
                opacity: 0.9;
            }
            .dots {
                display: flex;
                flex-wrap: wrap;
                gap: 0.4rem;
                margin-top: 0.6rem;
                padding: 0 0.1rem;
            }
            .dot {
                position: relative;
                width: 2rem;
                height: 2rem;
                border-radius: 50%;
                background: var(--c);
                color: #fff;
                font-size: 0.74rem;
                font-weight: 700;
                text-shadow: 0 0 2px #0007;
                display: grid;
                place-items: center;
                transition: transform 0.12s;
            }
            .dot:hover,
            .dot:focus-visible {
                transform: scale(1.18);
            }
            .dot.off {
                opacity: 0.18;
            }
            .dot.hd::after {
                content: "";
                position: absolute;
                right: -3px;
                top: -3px;
                width: 0.65rem;
                height: 0.65rem;
                border-radius: 50%;
                background: var(--d);
                border: 2px solid var(--card);
            }
            .loop {
                flex: none;
                display: flex;
                align-items: flex-start;
                background: color-mix(in srgb, var(--pri) 9%, var(--card));
                border: 2px solid
                    color-mix(in srgb, var(--pri) 28%, transparent);
                border-radius: 1.5rem;
                padding: 1.9rem 0.7rem 0.7rem;
                position: relative;
            }
            .loop > .ll {
                position: absolute;
                top: 0.5rem;
                right: 1rem;
                color: var(--pri);
                font-weight: 700;
                font-size: 0.78rem;
            }
            .lo {
                width: 1.8rem;
                margin: 2rem 0.2rem 0;
                flex: none;
            }
            .lo path {
                fill: none;
                stroke: var(--pri);
                stroke-width: 2.4;
                stroke-linecap: round;
            }
            #tip {
                position: fixed;
                left: 0;
                top: 0;
                z-index: 80;
                display: none;
                pointer-events: none;
                width: max-content;
                max-width: min(21rem, calc(100vw - 16px));
                background: var(--card);
                color: var(--fg);
                border: 1.5px solid var(--bd);
                border-radius: 1rem;
                padding: 0.75rem 0.9rem;
                box-shadow: 0 14px 40px #0006;
                font-size: 0.82rem;
            }
            #tip .tt {
                color: var(--mut);
                margin-bottom: 0.3rem;
            }
            #tip p {
                margin: 0 0 0.5rem;
                line-height: 1.45;
            }
            #tip .chips {
                margin: 0;
            }
            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }
            @keyframes dash {
                to {
                    stroke-dashoffset: -20;
                }
            }
            .go .node,
            .go .col,
            .go .loop {
                opacity: 0;
                animation: rise 0.45s ease-out forwards;
                animation-delay: calc(var(--i) * 110ms);
            }
            @media (max-width: 700px) {
                .two {
                    grid-template-columns: 1fr;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                * {
                    animation: none !important;
                    transition: none !important;
                }
                .go .node,
                .go .col,
                .go .loop {
                    opacity: 1;
                }
            }
        </style>
    </head>
    <body>
        <header class="hd">
            <div class="wrap">
                <div>
                    <h1>
                        <svg
                            class="i"
                            style="width: 2rem; height: 2rem"
                            viewBox="0 0 24 24"
                        >
                            <path
                                d="M9.9 15.5A2 2 0 0 0 8.5 14l-6.1-1.5a.5.5 0 0 1 0-1L8.5 10A2 2 0 0 0 9.9 8.5l1.6-6.1a.5.5 0 0 1 1 0L14 8.5A2 2 0 0 0 15.5 10l6.1 1.5a.5.5 0 0 1 0 1L15.5 14a2 2 0 0 0-1.4 1.5l-1.6 6.1a.5.5 0 0 1-1 0z"
                            /></svg
                        >Metodologías Cualitativas
                    </h1>
                    <p>
                        Explora 48 métodos especializados de análisis
                        cualitativo
                    </p>
                </div>
                <button class="ib" id="th" aria-label="Cambiar tema"></button>
            </div>
        </header>
        <main class="wrap">
            <div class="srch">
                <input
                    id="q"
                    placeholder="Buscar métodos por nombre, descripción o propósito..."
                    aria-label="Buscar"
                />
            </div>
            <div id="view"></div>
        </main>
        <div class="ov" id="ov" role="dialog" aria-modal="true">
            <div class="sheet" id="sheet"></div>
        </div>
        <div id="tip" role="tooltip"></div>
        <script>
            const D = {"etapas":[{"id":"preparacion","n":"Preparación","c":"#c4b5fd"},{"id":"exploracion","n":"Exploración","c":"#a78bfa"},{"id":"analisis","n":"Análisis","c":"#8b5cf6"},{"id":"sintesis","n":"Síntesis","c":"#6d28d9"},{"id":"adicional","n":"Pasos adicionales","c":"#9ca3af"}],"tipos":{"ETI":{"n":"Ética","g":"prep","c":"#0ea5e9","d":"Resguardo ético de participantes y datos: consentimiento informado, aprobación de comité de ética, anonimización, confidencialidad, manejo de riesgos."},"ADE":{"n":"Adecuación","g":"prep","c":"#14b8a6","d":"Trabajo de gabinete o con fuentes externas (literatura, documentos previos, expertos, piloto) cuyo fin es AJUSTAR, reformular o refinar las preguntas, objetivos, hipótesis o diseño del investigador. NO es recolectar los datos principales."},"CAL":{"n":"Calidad","g":"prep","c":"#f59e0b","d":"Identificar, evaluar o mitigar sesgos, limitaciones, vacíos, fiabilidad, representatividad o saturación de los datos o las fuentes."},"CNV":{"n":"Conversión de datos","g":"prep","c":"#84cc16","d":"Transcribir, digitalizar, traducir, aplicar OCR, formatear, segmentar, importar o estandarizar el material a un formato de trabajo común."},"IND":{"n":"Inducción","g":"ana","c":"#3b82f6","d":"Describir y organizar TODO el conjunto de datos desde los propios datos, sin teoría previa: tematización, paráfrasis, resumen, codificación abierta o inductiva, descripción densa, agrupar fragmentos."},"DED":{"n":"Deducción","g":"ana","c":"#6366f1","d":"Usar marcos teóricos, conceptos o categorías previas (a priori) de autores específicos para organizar, priorizar o interpretar los datos: codificación deductiva, aplicar un modelo, teoría o protocolo de análisis ya existente."},"ABD":{"n":"Abducción","g":"ana","c":"#d946ef","d":"Crear y verificar hipótesis o explicaciones: comparación constante o iterativa de casos o documentos, creación de conceptos, nombrar patrones, taxonomías o tipologías, codificación axial o selectiva, casos negativos, ir y venir entre teoría y datos."},"CAS":{"n":"Estudio de caso","g":"sin","c":"#f97316","d":"Presentar las características del caso organizadas por temas y subtemas (informe descriptivo estructurado)."},"ESQ":{"n":"Esquema teórico","g":"sin","c":"#ef4444","d":"Formular un modelo, teoría, proposiciones o marco conceptual explícito."},"NAR":{"n":"Narrativa","g":"sin","c":"#ec4899","d":"Relato continuo: biográfico (BIO), histórico (HIS) o causal (CAU). Indicar el subtipo en `narrativa`."},"CMP":{"n":"Comparación","g":"sin","c":"#eab308","d":"Redactar contrastes entre casos, grupos o narrativas."},"DIA":{"n":"Diagramación","g":"sin","c":"#10b981","d":"Unir hechos aparentemente desconectados en un diagrama, mapa, red o esquema visual."},"MEM":{"n":"Memo analítico","g":"sin","c":"#b45309","d":"Escribir memos, notas analíticas o reflexividad del investigador. (Tipo añadido)"},"ARG":{"n":"Discusión","g":"sin","c":"#0891b2","d":"Argumentar e interpretar los hallazgos frente a la literatura, sus limitaciones, implicaciones y conclusiones. (Tipo añadido)"},"NC":{"n":"Sin clasificación clara","g":"any","c":"#9ca3af","d":"La tarea no encaja con claridad en ningún tipo de su etapa."}},"datos":{"ENT":{"n":"Entrevistas y grupos","c":"#e11d74"},"OBS":{"n":"Observación y campo","c":"#0d9488"},"AVI":{"n":"Audio y video","c":"#ea580c"},"DOC":{"n":"Documentos y textos","c":"#2563eb"},"ENC":{"n":"Encuestas y datos numéricos","c":"#7c3aed"},"LIT":{"n":"Literatura académica","c":"#65a30d"},"DIG":{"n":"Datos digitales y redes","c":"#0891b2"},"OTR":{"n":"Otro dato","c":"#64748b"}},"tonos":{"CRI":"Crítico","CIE":"Científico","ART":"Artístico","EVP":"Evaluativo-propositivo"},"narr":{"BIO":"Biográfica","HIS":"Histórica","CAU":"Causal"},"jer":{"Analisis Interno":{"nombre":"Análisis interno","c":["#9333EA","#A855F7"],"d":"Descompone la realidad en partes para aprender de la fragmentación.","cats":{"Descripcion pura":{"c":["#9F46F2","#B574F7"],"d":"Describe fenómenos directamente sin filtros teóricos previos.","subs":{"Analisis naturalista":["#B574F7","#CCA3FA"],"Analisis linguistico":["#DE6EF3","#E59BF7"],"Conceptualizacion":["#E59BF7","#E59BF7"]}},"Descripcion limitada por teoria":{"c":["#6F2ED8","#7F4FE8"],"d":"Utiliza marcos teóricos específicos para guiar la descripción.","subs":{"Analisis naturalista":["#7F4FE8","#9E7FF2"],"Analisis linguistico":["#9E7FF2","#B6A3F7"],"Conceptualizacion":["#B6A3F7","#B6A3F7"]}}}},"Analisis Formal":{"nombre":"Análisis formal","c":["#0D9488","#14B8A6"],"d":"Sintetiza patrones para revelar estructuras formales y sistemáticas.","cats":{"Induccion comparativa desde datos abiertos":{"c":["#14B8A6","#2DD4BF"],"d":"Compara casos para identificar patrones emergentes.","subs":{"Analisis linguistico":["#2DD4BF","#5EEAD4"],"Conceptualizacion":["#5EEAD4","#99F6E4"],"Metodos causales":["#22D3EE","#67E8F9"]}},"Construccion de modelos basados en tecnicas especificas":{"c":["#0891B2","#06B6D4"],"d":"Aplica técnicas formales para modelar estructuras sociales.","subs":{"Analisis linguistico":["#06B6D4","#22D3EE"],"Analisis naturalista":["#10B981","#34D399"],"Conceptualizacion":["#6EE7B7","#6EE7B7"]}}}}},"subdesc":{"Analisis naturalista":"Examina fenómenos en contextos naturales sin imposición teórica.","Analisis linguistico":"Analiza el uso del lenguaje en contextos reales.","Conceptualizacion":"Identifica temas y conceptos que emergen directamente de los datos.","Metodos causales":"Reconstruye relaciones causales entre fenómenos a partir de los datos."},"metodos":[{"id":"etnometodologia","nombre":"Etnometodologia","familia":"Analisis Interno","categoria":"Descripcion pura","subcategoria":"Analisis naturalista","ideal_para":"Entender cómo se produce y reproduce el orden social en interacciones cotidianas.","src":"ia","res":{"preparacion":5,"exploracion":3,"analisis":8,"sintesis":3,"adicional":2,"total":21},"entradas":[{"id":"LIT","n":1},{"id":"AVI","n":1}],"etapas":[{"id":"preparacion","t":[[1,"Seleccionar y revisar literatura seminal sobre movilidad situada, formaciones móviles y análisis de categorías de membresía (Ryave y Schenkein, Lee y Watson, Sacks, Mondada, González-Martínez, Weilenmann et al.) para fundamentar el marco teórico y metodológico del estudio.","ADE",["LIT"],"NA","NA","A"],[2,"Definir el fenómeno de estudio: la formación de líneas de caminata (walking lanes) y el paso a través de puertas en centros comerciales, como un logro local y situado de los participantes.","ADE",[],"NA","NA","A"],[3,"Establecer el diseño del estudio basado en grabaciones de video de movimientos naturales de peatones en varios centros comerciales en Francia.","ADE",[],"NA","NA","A"],[4,"Seleccionar secuencias cortas de video en las que múltiples peatones se acercan y pasan a través de puertas en un campo de visión relativamente despejado, y donde se pueda rastrear la emergencia y disolución de formaciones en línea.","NC",["AVI"],"NA","NA","A"],[5,"Organizar el material de video para su análisis, incluyendo la captura de imágenes fijas (fotogramas) en intervalos cortos para documentar la progresión de las formaciones.","CNV",[],"NA","NA","A"]]},{"id":"exploracion","t":[[6,"Realizar una inspección repetida y detallada de las grabaciones de video para identificar patrones recurrentes de trayectoria, orientación corporal y manipulación de puertas.","NC",[],"NA","NA","A"],[7,"Anotar los tiempos de los fragmentos clave para resaltar la transformación progresiva de las formaciones (por ejemplo, de caminar lado a lado a una línea de seguimiento) y la aparición momento a momento de posiciones como primero en la fila, siguiente y último.","CNV",[],"NA","NA","A"],[8,"Examinar cómo los propios participantes, a través de sus acciones prácticas in situ, muestran y ratifican posiciones como primero en la fila y seguidor, en lugar de imponer categorías analíticas externas.","NC",[],"NA","NA","A"]]},{"id":"analisis","t":[[9,"Aplicar el enfoque etnometodológico y de análisis conversacional para examinar la organización secuencial de las acciones de los peatones al acercarse y pasar por las puertas.","DED",[],"NA","NA","A"],[10,"Utilizar el Análisis de Categorías de Membresía (MCA) para identificar cómo los participantes producen y reconocen categorías como 'primero en la fila', 'siguiente', 'último', 'seguidor', 'abridor', 'juntos' o 'solo' en las formaciones móviles.","DED",[],"NA","NA","A"],[11,"Analizar la orientación conjunta de los peatones hacia las puertas como un 'gestalt contexture' (Garfinkel/Gurwitsch), examinando cómo la selección de una puerta particular actúa como soporte externo para la formación de la línea.","DED",[],"NA","NA","A"],[12,"Examinar la manipulación activa de la puerta (agarrar, retener, sostener) y cómo esta modifica el orden serial y expresa distintos modos de coordinación entre los peatones (orientación propia vs. cooperativa).","IND",[],"NA","NA","A"],[13,"Identificar y analizar los diferentes momentos del paso a través de la puerta (orientación, agarre, retención, liberación, entrega al siguiente) y cómo se ajustan a las propiedades materiales de la puerta y a las señales visuales de los movimientos conjuntos.","IND",[],"NA","NA","A"],[14,"Comparar las formaciones de línea (walking lanes) con las formaciones lado a lado (side-by-side) en términos de proximidad espacial, dirección compartida, ritmo sincronizado y oportunidades interaccionales.","ABD",[],"NA","NA","A"],[15,"Documentar la emergencia de la línea a través de la selección de una puerta por parte de un primer peatón, y cómo otros peatones se alinean detrás de él, formando una 'flow file' (archivo de flujo).","IND",[],"NA","NA","A"],[16,"Analizar cómo los peatones ajustan su ritmo y mantienen una distancia mínima con el precedente para resolver problemas de navegación (evitar colisiones, hacer desvíos, pasar uno a la vez).","IND",[],"NA","NA","A"]]},{"id":"sintesis","t":[[17,"Construir un modelo teórico que integre los hallazgos sobre cómo las puertas contribuyen a la formación de líneas de caminata, la emergencia de categorías de membresía y la coordinación secuencial en el paso a través de puertas.","ESQ",[],"NA","NA","A"],[18,"Redactar el análisis detallado de los fragmentos de video, incluyendo la descripción de las figuras (fotogramas) con anotaciones sobre direcciones de movimiento, orientaciones y posiciones categoriales.","CAS",[],"NA","NA","A"],[19,"Elaborar el reporte final del estudio, presentando los hallazgos sobre la organización práctica y local de las formaciones móviles en espacios públicos, y discutiendo las implicaciones para la etnometodología, el MCA y los estudios de materialidad.","ARG",[],"NA","NA","A"]]},{"id":"adicional","t":[[20,"Validar el análisis mediante la revisión de pares (acknowledgements: Andrew Carlin) y la presentación de una versión preliminar en el taller COOP 2014 'The Role of Artefacts in Social Coordination'.","CAL",[],"NA","NA","A"],[21,"Mantener un proceso iterativo de comparación entre los datos de video y el marco teórico, asegurando que el análisis permanezca estrechamente ligado a los datos y no sea meramente inferencial (análisis no intuitivo).","ABD",[],"NA","NA","A"]]}],"estudio":{"titulo":"Walking Lanes / Walking Lines: Bodily Alignments and Passing Through Doorways","autores":["Marc Relieu","Catherine Félix","Rod Watson"],"anio":"2026","tipo":"paper","url":"https://doi.org/10.26485/PS/2026/75.1/3","origen":"DOI detectado en el PDF aportado","confianza":"alta","notas":"El texto no detalla explícitamente el uso de software de análisis cualitativo; el análisis se basa en inspección visual repetida de videos. La fase de síntesis se infiere de la estructura del artículo (resultados y conclusiones)."},"img":"data:image/webp;base64,UklGRhgGAABXRUJQVlA4IAwGAAAQIQCdASqAAIAAPp1KnkulpCKhpRM7GLATiWkAFtG+Ef652o84v64zgsd/Thg54K95fvyyeboTm3949AL13+k/63vif6/0A4IrwBvF/YA/mf9j/6fsj/zvi7+gP/N/kfgG/mH9c/X32u/Xp+4/sj/ssWxvf7NF1v0OJAP4k10T64EL/X1/QE6fT478I/q8R0PW56mbONgOa6Q6W9maRUtdkPFvZXgfsdft6IPV7TbezwFMkDpL85J15TfpXs5+Whsu4KdEofFd8 profundos y estructurados en textos o expresiones culturales.","src":"ia","res":{"preparacion":8,"exploracion":3,"analisis":7,"sintesis":3,"adicional":2,"total":23},"entradas":[{"id":"ENT","n":5},{"id":"LIT","n":1},{"id":"DOC","n":1}],"etapas":[{"id":"preparacion","t":[[1,"Realizar una revisión de literatura cuantitativa y cualitativa sobre sucesión agrícola para identificar vacíos metodológicos y justificar el enfoque cualitativo.","ADE",["LIT"],"NA","NA","A"],[2,"Seleccionar el método de hermenéutica objetiva como enfoque cualitativo de estudio de caso.","ADE",[],"NA","NA","A"],[3,"Definir el objetivo de explorar procesos de sucesión agrícola mediante análisis de secuencias textuales de entrevistas.","ADE",[],"NA","NA","A"],[4,"Realizar entrevistas semiestructuradas a agricultores jubilados y parejas agrícolas en toda Suiza.","NC",["ENT"],"NA","NA","A"],[5,"Seleccionar un caso único (familia Ammann) para análisis en profundidad.","NC",["ENT"],"NA","NA","A"],[6,"Transcribir la entrevista del caso seleccionado en abril de 2006.","CNV",[],"NA","NA","A"],[7,"Recopilar información biográfica de la familia entrevistada, incluyendo datos de dos o tres generaciones anteriores.","NC",["ENT","DOC"],"NA","NA","M"],[8,"Elaborar un árbol genealógico o diagrama biográfico detallado de la familia para contextualizar el caso.","CNV",[],"NA","NA","M"]]},{"id":"exploracion","t":[[9,"Seleccionar secuencias específicas de la transcripción relacionadas con procesos de sucesión.","NC",["ENT"],"NA","NA","A"],[10,"Incluir la secuencia de apertura de la entrevista para analizar la estructura social de los entrevistados.","NC",["ENT"],"NA","NA","A"],[11,"Realizar una primera lectura de las secuencias seleccionadas para identificar temas emergentes como conflicto y jerarquía.","NC",[],"NA","NA","A"]]},{"id":"analisis","t":[[12,"Analizar cada secuencia textual de manera microscópica y detallada, examinando minuciosamente las expresiones verbales.","IND",[],"NA","NA","A"],[13,"Reflexionar sob ion","t":[[1,"Diseñar el estudio cualitativo con enfoque de gerontología narrativa y análisis narrativo dialógico, fundamentado en los marcos teóricos de Frank, Holstein y Gubrium, y Freeman.","ADE",[],"NA","NA","A"],[2,"Definir los criterios de inclusión de participantes: personas mayores de 68 a 96 años que se autoidentificaran como Sami y que residieran en dos municipios del norte de Noruega, uno dentro del área nuclear Sami y otro fuera de ella.","ADE",[],"NA","NA","A"],[3,"Reclutar a los participantes a través de hogares de ancianos, servicios de atención domiciliaria y asociaciones locales de personas mayores.","NC",["ENT"],"NA","NA","A"],[4,"Distribuir cartas de información y formularios de consentimiento en idiomas Sami y noruego a los participantes potenciales.","ETI",[],"NA","NA","A"],[5,"Obtener la aprobación del Comité Regional de Ética en Investigación Médica y asegurar el consentimiento informado de los participantes.","ETI",[],"NA","NA","A"],[6,"Realizar entrevistas cualitativas semiestructuradas y abiertas, invitando a los participantes a narrar sus historias de vida, con una duración de 45 a 150 minutos, en el hogar o institución de los participantes.","NC",["ENT"],"NA","NA","A"],[7,"Registrar digitalmente las entrevistas en audio y transcribirlas textualmente.","CNV",["AVI"],"NA","NA","A"],[8,"Registrar notas de campo durante el proceso de investigación para su uso en varias etapas del análisis.","NC",["OBS"],"NA","NA","A"]]},{"id":"exploracion","t":[[9,"Releer las transcripciones y reproducir las grabaciones de audio varias veces para familiarizarse con el material.","CNV",[],"NA","NA","A"],[10,"Trabajar con una entrevista a la vez, realizando una búsqueda intencionada de historias dentro de cada transcripción.","NC",[],"NA","NA","A"],[11,"Identificar y delimitar las historias dentro del texto, considerando que los límites de las historias no son claros y que el investigador participa en su construcción.","NC",[],"NA","NA","A"]]},{"id":"analisis", acion":3,"analisis":4,"sintesis":3,"adicional":4,"total":23},"entradas":[{"id":"ENT","n":2}],"etapas":[{"id":"preparacion","t":[[1,"Seleccionar ocho comunas de Chile con mayor densidad de población migrante y altos índices de vulnerabilidad social (Arica, Iquique, Calama, Antofagasta, Santiago, Recoleta, Independencia y Maipú).","ADE",[],"NA","NA","A"],[2,"Contactar a autoridades de salud de los gobiernos comunales de cada localidad para gestionar el acceso a los centros de salud primaria.","ADE",[],"NA","NA","A"],[3,"Seleccionar, a través de las autoridades comunales, al menos dos centros de salud primaria por comuna que presentaran mayor densidad de población migrante internacional inscrita (formal o informalmente).","ADE",[],"NA","NA","A"],[4,"Reclutar participantes mediante la técnica de bola de nieve, incluyendo directores de atención primaria, autoridades locales municipales y trabajadores de salud primaria (TSP).","NC",["ENT"],"NA","NA","A"],[5,"Aplicar criterios de inclusión: ser mayor de 18 años, mantener relación formal de trabajo con el centro de salud o gobierno local, y haber tenido contacto con población migrante internacional.","ADE",[],"NA","NA","A"],[6,"Desarrollar guiones de entrevistas semiestructuradas y grupos focales basados en dos temáticas principales: (1) relación entre el sistema de salud público y los migrantes internacionales, y (2) condiciones de vida de la población migrante.","ADE",[],"NA","NA","A"],[7,"Adaptar los guiones de entrevistas a cada tipo de participante (directores, autoridades locales, TSP).","ADE",[],"NA","NA","A"],[8,"Realizar 40 entrevistas semiestructuradas (29 individuales, 2 bipersonales) y 8 grupos focales entre 2014 y 2016, en dos etapas: levantamiento inicial y confirmación de datos.","NC",["ENT"],"NA","NA","A"],[9,"Alcanzar saturación de información para cada comuna, definida como el momento en que el material cualitativo recolectado deja de aportar nuevos datos.","CAL",[],"NA","NA","A"]]},{"id":"exploracion","t" produciendo etiquetas descriptivas o interpretativas breves pero suficientes para mantenerse por sí solas. (Sección 3.2.2) — [Sección 3.2.2] — [Sección 3.2.2]","IND",[],"NA","NA","A"],[14,"Realizar la primera iteración de codificación utilizando la función de comentarios en Microsoft Word, anotando los códigos en el margen y resaltando el área de texto asignada. (Sección 3.2.2) — [Sección 3.2.2] — [Sección 3.2.2]","IND",[],"NA","NA","A"],[15,"Transferir todos los códigos de la primera iteración a una hoja de cálculo de Microsoft Excel con una etiqueta que identifique al participante respectivo. (Sección 3.2.2) — [Sección 3.2.2] — [Sección 3.2.2]","NC",[],"NA","NA","A"],[16,"Documentar las iteraciones de codificación en la hoja de cálculo, resaltando los códigos que cambian en cada iteración sucesiva y consultando regularmente las transcripciones originales para evaluar los códigos existentes y examinar nuevos códigos. (Sección 3.2.2) — [Sección 3.2.2] — [Sección 3.2.2]","IND",[],"NA","NA","A"],[17,"Revisar y refinar los códigos a través de iteraciones: abandonar convenciones de codificación que no resulten útiles, reemplazar códigos descriptivos poco informativos por otros más representativos y subsumir códigos demasiado específicos en códigos preexistentes. (Sección 3.2.2) — [Sección 3.2.2] — [Sección 3.2.2]","IND",[],"NA","NA","A"],[18,"Permitir que un mismo ítem de datos sea codificado tanto semántica como latentemente si se considera necesario. (Sección 3.2.2) — [Sección 3.2.2] — [Sección 3.2.2]","IND",[],"NA","NA","A"],[19,"Generar temas iniciales: revisar los datos codificados y analizar cómo diferentes códigos pueden combinarse según significados compartidos para formar temas o subtemas, colapsando códigos similares o promoviendo códigos a subtemas/temas. (Sección 3.2.3) — [Sección 3.2.3] — [Sección 3.2.3]","ABD",[],"NA","NA","A"],[20,"Construir un mapa temático inicial (por ejemplo, un mapa mental o de afinidad) que coloque los códigos y los ítems de datos en relación con sus respectivos temas candidatos. (Sección 3.2.3) — [Sección 3.2.3] — [Sección 3.2.3]","NC",[],"NA","NA","A"],[21,"Revisar los temas candidatos en dos niveles: nivel uno, revisar las relaciones entre los ítems de datos y los códigos que informan cada tema (homogeneidad interna); nivel dos, revisar los temas en relación con el conjunto de datos y las preguntas de investigación (heterogeneidad externa). (Sección 3.2.4) — [Sección 3.2.4] — [Sección 3.2.4]","ABD",[],"NA","NA","A"],[22,"Aplicar los criterios duales de Patton (homogeneidad interna y heterogeneidad externa) al revisar los temas. (Sección 3.2.4) — [Sección 3.2.4] — [Sección 3.2.4]","ABD",[],"NA","NA","A"],[23,"Reestructurar los temas según sea necesario: dividir subtemas en nuevos subtemas, fusionar subtemas, eliminar temas que no funcionen y reconceptualizar los datos. (Sección 3.2.4) — [Sección 3.2.4] — [Sección 3.2.4]","ABD",[],"NA","NA","A"],[24,"Reiterar fases anteriores del análisis (codificación y generación de temas) cuando sea necesario, recodificando ítems de datos, colapsando códigos, eliminando códigos o promoviendo códigos a subtemas/temas. (Sección 3.2.4) — [Sección 3.2.4] — [Sección 3.2.4]","ABD",[],"NA","NA","A"],[25,"Producir un mapa temático revisado que capture los elementos más importantes de los datos en relación con las preguntas de investigación. (Sección 3.2.4) — [Sección 3.2.4] — [Sección 3.2.4]","NC",[],"NA","NA","A"]]},{"id":"sintesis","t":[[26,"Definir y nombrar los temas: presentar un análisis detallado de cada tema y subtema en relación con el conjunto de datos y las preguntas de investigación, asegurando coherencia interna y una narrativa general lúcida. (Sección 3.2.5) — [Sección 3.2.5] — [Sección 3.2.5]","CAS",[],"NA","NA","A"],[27,"Seleccionar extractos de datos para el informe que proporcionen un relato vívido y convincente de los argumentos de cada tema, utilizando múltiples extractos de todo el grupo de ítems de datos para transmitir la diversidad de expresiones de significado y demostrar la cohesión. (Sección 3.2.5) — [Sección 3.2.5] — [Sección 3.2.5]","CAS",[],"NA","NA","A"],[28,"Analizar en profundidad cada extracto de datos reportado, interpretándolo en relación con su tema constitutivo y el contexto más amplio de las preguntas de investigación, creando una narrativa analítica. (Sección 3.2.5) — [Sección 3.2.5] — [Sección 3.2.5]","ARG",[],"NA","NA","A"],[29,"Decidir si presentar los extractos de datos de manera ilustrativa o analítica, y contextualizar los extractos en relación con la literatura disponible según corresponda. (Sección 3.2.5) — [Sección 3.2.5] — [Sección 3.2.5]","ARG",[],"NA","NA","A"],[30,"Revisar y finalizar los nombres de los temas, asegurándose de que sean concisos, informativos y memorables, y considerando el uso de extractos cortos para puntuar los nombres. (Sección 3.2.5) — [Sección 3.2.5] — [Sección 3.2.5]","CAS",[],"NA","NA","A"],[31,"Establecer el orden en que se reportan los temas, asegurando que se conecten de manera lógica y significativa, construyendo una narrativa coherente de los datos. (Sección 3.2.6) — [Sección 3.2.6] — [Sección 3.2.6]","CAS",[],"NA","NA","A"],[32,"Completar y realizar la inspección final del informe, que probablemente se habrá comenzado a escribir antes de emprender el análisis temático. (Sección 3.2.6) — [Sección 3.2.6] — [Sección 3.2.6]","CAS",[],"NA","NA","A"],[33,"Sintetizar y contextualizar los datos a medida que se reportan en la sección de resultados, en lugar de separar resultados y discusión, priorizando el estilo de reporte apropiado para RTA. (Sección 3.2.6) — [Sección 3.2.6] — [Sección 3.2.6]","ARG",[],"NA","NA","A"]]},{"id":"adicional","t":[[34,"Mantener un enfoque recursivo e iterativo a lo largo de todo el proceso de seis fases, moviéndose de un lado a otro entre las fases según sea necesario. (Sección 3.2) — [Sección 3.2] — [Sección 3.2]","NC",[],"NA","NA","A"],[35,"Documentar la progresión a través de las iteraciones de codificación y los cambios en los temas, haciendo notas sobre por qué son necesarios los cambios significativos. (Sección 3.2.2, 3.2.4) — [Sección 3.2.2, 3.2.4] — [Sección 3.2.2, 3.2.4]","MEM",[],"NA","NA","A"],[36,"Mantener un diario de investigación o notas y memos informales durante todo el curso de la investigación para documentar los cambios y el proceso analítico. (Sección 3.2.6) — [Sección 3.2.6] — [Sección 3.2.6]","MEM",[],"NA","NA","A"]]}],"estudio":{"titulo":"A worked example of Braun and Clarke's approach to reflexive thematic analysis","autores":["David Byrne"],"anio":null,"tipo":"tesis","url":"https://link.springer.com/content/pdf/10.1007/s11135-021-01182-y.pdf","origen":"documento descargado","confianza":"alta","notas":"El documento es un ejemplo trabajado de RTA, por lo que los pasos extraídos reflejan tanto las recomendaciones metodológicas generales de Braun y Clarke como las acciones específicas del autor. La clasificación en fases se realizó siguiendo las definiciones proporcionadas. La sección 3.1 (supuestos teóricos) se clasificó como pre-análisis, ya que se aborda antes de implementar el análisis. La fase de familiarización se clasificó como interpretación de fuentes, ya que implica la inmersión inicial en los datos. Las fases de codificación, generación y revisión de temas se clasificaron como análisis profundo. La fase de definición y nombramiento de temas, junto con la producción del informe, se clasificaron como síntesis. Los pasos adicionales incluyen el enfoque recursivo e iterativo y la documentación del proceso."},"img":null},{"id":"analisis-basado-en-giros-post","nombre":"Analisis basado en giros post","familia":"Analisis Interno","categoria":"Descripcion limitada por teoria","subcategoria":"Analisis naturalista","ideal_para":"Cuestionar supuestos establecidos y comprender partes nuevas, desconocidas o malentendidas de la sociedad.","src":"ia","res":{"preparacion":10,"exploracion":3,"analisis":4,"sintesis":3,"adicional":2,"total":22},"entradas":[{"id":"LIT","n":2},{"id":"ENT","n":1},{"id":"OBS","n":1}],"etapas":[{"id":"preparacion","t":[[1,"Realizar una búsqueda bibliográfica en la biblioteca de la F.C.S. con palabras clave específicas (Deleuze, Guattari, Deseo, Subjetividad, Revolución Molecular, Rizoma, Micropolítica, Sistema capitalístico, Línea/s de fuga, Agenciamiento) para identificar estudios previos y fundamentar el marco teórico.","ADE",["LIT"],"NA","NA","A"],[2,"Realizar una búsqueda adicional entre textos no ingresados en la base de datos digital para localizar investigaciones que apliquen la teoría deleuzeana al análisis de campo.","ADE",["LIT"],"NA","NA","A"],[3,"Seleccionar el espacio de estudio 'La Cueva del Uapití' (antes 'La Terka') en Montevideo, barrio Palermo, basándose en la observación de que sus asistentes no reproducían automáticamente las máquinas deseantes capitalistas y actualizaban contenidos y expresiones de líneas de fuga en organización e intercambio.","ADE",[],"NA","NA","A"],[4,"Definir el objetivo general y los objetivos específicos de la investigación: estudiar la micropolítica de transformación molecular en las luchas de deseo, identificar contenidos y expresiones molares de las líneas 'organización' e 'intercambio de bienes y servicios', y evidenciar la tensión entre fuerzas desterritorializadoras y reterritorializadoras.","ADE",[],"NA","NA","A"],[5,"Elaborar el marco teórico basado en los aportes de Gilles Deleuze y Félix Guattari, incluyendo conceptos como empirismo trascendental, virtual/actual, molecular/molar, agenciamiento, contenido/expresión, y micropolítica.","ADE",[],"NA","NA","A"],[6,"Diseñar la metodología cualitativa, seleccionando la entrevista semi-estructurada y la observación participante como técnicas apropiadas para recabar contenidos y expresiones a nivel molar.","ADE",[],"NA","NA","A"],[7,"Diseñar la pauta de entrevista semi-estructurada, incluyendo temas 'más sociales' (organización, vinculación con política partidaria, vínculo con el barrio) y temas 'más personales' (reacción de amigos y familiares, trayectoria personal, impacto de la experiencia) para abordar la subjetividad desde la teoría deleuzeana.","ADE",[],"NA","NA","A"],[8,"Establecer cuatro grupos de entrevistados: fundadores, residentes actuales, talleristas y asistentes habituales (más de un año de concurrencia), adaptando las preguntas según el vínculo de cada grupo con el lugar.","ADE",[],"NA","NA","A"],[9,"Realizar 13 entrevistas individuales y una grupal a fundadoras (Sam y Paula), residentes y ex-residentes (Fede, Pabloski, Roitk, Monk), talleristas (Bajonera, Cronopio, Cecilia), asistentes (Pedro, Iael, Socram) y un colectivo de sellos independientes.","NC",["ENT"],"NA","NA","A"],[10,"Realizar observación participante en el espacio estudiado desde Julio de 2012 a Junio de 2016, registrando contenidos y expresiones molares como vestimenta, gestos, disposición de muebles, dinámicas de interacción, etc.","NC",["OBS"],"NA","NA","A"]]},{"id":"exploracion","t":[[11,"Realizar una primera exploración de los datos recabados en campo (entrevistas y observación participante) para obtener impresiones iniciales sobre las dinámicas del espacio.","NC",[],"NA","NA","A"],[12,"Ordenar y transcribir las entrevistas realizadas, así como sistematizar las notas de observación participante.","CNV",[],"NA","NA","A"],[13,"Realizar lecturas superficiales de las transcripciones y notas para identificar temas emergentes y familiarizarse con el contenido.","NC",[],"NA","NA","A"]]},{"id":"analisis","t":[[14,"Aplicar la técnica de codificación abierta para identificar contenidos y expresiones molares referentes a las líneas 'organización' e 'intercambio de bienes y servicios' en las entrevistas y observaciones.","IND",[],"NA","NA","A"],[15,"Aplicar la técnica de codificación axial para establecer relaciones entre las categorías emergentes y los conceptos teóricos deleuzeanos (contenido, expresión, fuerzas desterritorializadoras y reterritorializadoras).","ABD",[],"NA","NA","A"],[16,"Realizar un análisis de contenido y expresión a nivel molar para evidenciar la tensión entre fuerzas desterritorializadoras y reterritorializadoras en las líneas de organización e intercambio.","DED",[],"NA","NA","A"],[17,"Identificar patrones y regularidades en los datos que permitan comprender la dinámica molecular de los agenciamientos del deseo en el espacio estudiado.","ABD",[],"NA","NA","A"]]},{"id":"sintesis","t":[[18,"Redactar memos analíticos durante el proceso de análisis para documentar interpretaciones, conexiones teóricas y reflexiones emergentes.","MEM",[],"NA","NA","A"],[19,"Construir un modelo teórico que integre los hallazgos empíricos con los conceptos deleuzeanos, explicando la micropolítica de transformación molecular en las luchas de deseo.","ESQ",[],"NA","NA","A"],[20,"Elaborar el reporte final de la tesis, estructurado en: resumen, introducción, breve reseña del espacio estudiado, marco teórico, metodología, análisis, reflexiones sobre micropolítica, conclusiones y posibles estudios futuros.","ARG",[],"NA","NA","A"]]},{"id":"adicional","t":[[21,"Realizar un proceso iterativo de comparación constante entre los datos y la teoría, ajustando el marco conceptual y las interpretaciones a medida que emergían nuevos hallazgos.","ABD",[],"NA","NA","A"],[22,"Validar los hallazgos mediante la triangulación de fuentes (entrevistas de diferentes grupos, observación participante) y la revisión por pares (tutora).","CAL",[],"NA","NA","A"]]}],"estudio":{"titulo":"Guerrilla de la paz: micropolítica de transformación molecular","autores":["María Gabriela Ottón Santi"],"anio":"2018","tipo":"tesis","url":null,"origen":"PDF aportado manualmente, sin enlace","confianza":"alta","notas":"El texto no especifica explícitamente el uso de software cualitativo, por lo que no se incluyó en el análisis profundo. La codificación se infiere de la descripción del análisis de contenido y expresión, aunque no se menciona explícitamente el término 'codificación'."},"img":null},{"id":" datos para refinar el mapeo institucional.","ABD",[],"NA","NA","A"]]}],"estudio":{"titulo":"Nationally Consistent Collection of Data on School Students with Disability (NCCD): an institutional ethnography of student funding","autores":["Jeanine Gallagher"],"anio":"2022","tipo":"tesis","url":"https://eprints.qut.edu.au/236241/1/Jeanine%2BGallagher%2Bthesis%282%29.pdf","origen":"documento descargado","confianza":"alta","notas":"El texto es una tesis doctoral que describe explícitamente el método de etnografía institucional. Los pasos se extrajeron de las secciones de método, análisis y discusión. Algunos pasos adicionales (validación por pares) se infieren de la práctica estándar de IE, pero no se mencionan explícitamente en el texto."},"img":null},{"id":"analisis-de-metaforas","nombre":"Analisis de metaforas","familia":"Analisis Formal","categoria":"Induccion comparativa desde datos abiertos","subcategoria":"Analisis linguistico","ideal_para":"Descubrir estructuras conceptuales implícitas que organizan el pensamiento y discurso.","src":"ia","res":{"preparacion":8,"exploracion":2,"analisis":10,"sintesis":2,"adicional":2,"total":24},"entradas":[{"id":"LIT","n":4},{"id":"DOC","n":1}],"etapas":[{"id":"preparacion","t":[[1,"Seleccionar un corpus de veinte discursos presidenciales (diez de George W. Bush y diez de Barack Obama) sobre dos temas: guerra en Irak y atención médica, con aproximadamente 60,000 palabras en total, equilibrado entre los cuatro subcorpus (cinco discursos por presidente y tema).","NC",["DOC"],"NA","NA","A"],[2,"Reutilizar el corpus seleccionado y analizado previamente por Wolters (2012), justificando su elección por la relevancia de los temas para la política estadounidense y su alto carácter valórico.","ADE",["LIT"],"NA","NA","A"],[3,"Definir el esquema de anotación sociopsicológico basado en Moses y Gonzales (2015), seleccionándolo por mantenerse más cerca de las descripciones de Lakoff (2002 [1996]) y por ser más adecuado para la comparación que otros esquemas.","ADE",["LIT"],"NA","NA","A"],[4,"Definir el esquema de anotación cognitivo-lingüístico basado en Wolters (2012), que utiliza la técnica de análisis de corpus de Koller (2008) y el procedimiento MIPVU (Steen et al. 2010), seleccionándolo por su claridad y confiabilidad probada en comparación con el método de Cienki (2005).","ADE",["LIT"],"NA","NA","A"],[5,"Ajustar el esquema sociopsicológico original: definir la unidad de análisis como 'unidad de discurso' (cláusulas restrictivas pertenecen a la oración principal; cláusulas expansivas son unidades independientes, siguiendo a Steen 2005).","ADE",[],"NA","NA","A"],[6,"Ajustar el esquema sociopsicológico: omitir las categorías 'Other SF ideas' y 'Other NP ideas' por falta de descripción explícita, y cambiar el término 'uncodeable' por 'unrelated' para evitar ambigüedad.","ADE",[],"NA","NA","A"],[7,"Ajustar el esquema cognitivo-lingüístico: aplicar la misma solución que en el método 1 para decidir si una expresión metafórica tiene la moralidad como dominio meta, es decir, considerar que los ítems léxicos metafóricos que ocurren en unidades de análisis anotadas como expresiones de Moral Politics en el método 1 son expresiones con moralidad como dominio meta.","ADE",[],"NA","NA","A"],[8,"Compilar listas de ítems léxicos representativos para cada metáfora conceptual priorizada de los modelos Strict Father y Nurturant Parent, tomados de Lakoff (2002 [1996]) y Cienki (2005): 91 tipos de ítems léxicos para Strict Father (40 sustantivos, 26 verbos, 25 adjetivos) y 94 para Nurturant Parent (40 sustantivos, 40 verbos, 14 adjetivos).","ADE",["LIT"],"NA","NA","A"]]},{"id":"exploracion","t":[[9,"Dividir el corpus en unidades de análisis (discourse units) siguiendo la definición ajustada: cláusulas restrictivas pertenecen a la oración principal; cláusulas expansivas son unidades independientes.","CNV",[],"NA","NA","A"],[10,"Evaluar la confiabilidad de la división en unidades de análisis: dos codificadores aplicaron el método a una subsección de los datos, con 199 acuerdos, 8 desacuerdos del primer codificador y 10 del segundo (margen de error <10%, considerado confiable).","CAL",[],"NA","NA","A"]]},{"id":"analisis","t":[[11,"Aplicar el esquema sociopsicológico: para cada unidad de análisis, determinar si aborda un tema político (definido como un tema en la agenda pública que involucra a un número considerable de individuos en la sociedad).","DED",[],"NA","NA","A"],[12,"Evaluar la confiabilidad de la codificación de temas políticos: un segundo codificador codificó un subcorpus de 300 unidades de análisis, resultando en Cohen's Kappa de 0.63 (acuerdo sustancial).","NC",[],"NA","NA","A"],[13,"Aplicar el esquema sociopsicológico: para las unidades de análisis consideradas políticas, decidir si son una expresión de moralidad (referencia a concepciones de comportamiento correcto/incorrecto o acciones/características buenas/malas de personas o gobiernos, descriptivas o evaluativas).","DED",[],"NA","NA","A"],[14,"Evaluar la confiabilidad de la codificación de moralidad: un segundo codificador codificó un subcorpus de 200 unidades de análisis, resultando en Cohen's Kappa de 0.67 (acuerdo sustancial).","NC",[],"NA","NA","A"],[15,"Aplicar el esquema sociopsicológico: asignar a cada expresión de Moral Politics (política y moral) una, ninguna o varias de las categorías Strict Father o Nurturant Parent formuladas por Moses y Gonzales (2015), considerando solo si la expresión puede subsumirse bajo los modelos SF y/o NP, independientemente de las categorías precisas.","DED",[],"NA","NA","A"],[16,"Evaluar la confiabilidad de la codificación en categorías SF y NP: Cohen's Kappa de 0.86 (acuerdo casi perfecto) para Strict Father y 0.70 (acuerdo sustancial) para Nurturant Parent, con subcorpus de 200 unidades de análisis cada uno.","NC",[],"NA","NA","A"],[17,"Aplicar el esquema cognitivo-lingüístico: aplicar el procedimiento MIPVU (Steen et al. 2010) a todos los tokens de los ítems léxicos listados n análisis de segundo orden derivado de conceptos, temas y dimensiones centrados en el investigador. (Gioia) (p. 286) [Sección: An Introduction to Three Qualitative Methods / Denny Gioia / Overview]","IND",[],"NA","NA","A"]]},{"id":"sintesis","t":[[4,"Construir una estructura de datos que muestre la progresión desde los datos brutos hasta los códigos de primer orden, los temas teóricos de segundo orden y las dimensiones, como parte de la demostración de rigor en la investigación cualitativa. (Gioia) (p. 286) [Sección: An Introduction to Three Qualitative Methods / Denny Gioia / Some basic steps]","DIA",[],"NA","NA","A"]]},{"id":"adicional","t":[[5,"Convertir la estructura de datos (fotografía estática) en un modelo de teoría fundamentada (película) que muestre las relaciones dinámicas entre los conceptos emergentes, explicando la relación entre la anatomía y la fisiología de la teoría. (Gioia) (p. 286) [Sección: An Introduction to Three Qualitative Methods / Denny Gioia / Some basic steps]","ESQ",[],"NA","NA","A"]]}],"estudio":{"titulo":"Finding Theory–Method Fit: A Comparison of Three Qualitative Approaches to Theory Building","autores":["Joel Gehman","Vern L. Glaser","Kathleen M. Eisenhardt","Denny Gioia","Ann Langley","Kevin G. Corley"],"anio":null,"tipo":"paper","url":"https://doi.org/10.1177/1056492617706029","origen":"documento descargado","confianza":"alta","notas":"El texto describe principalmente el método Gioia en detalle. Los métodos de Eisenhardt y Langley se mencionan pero no se detallan con el mismo nivel de especificidad procedimental. La extracción se centra en el método Gioia por ser el más explícitamente descrito en el fragmento."},"img":null},{"id":"teorizacion-centrada-en-el-diseno-stigliani-corley-gioia","nombre":"Teorización Centrada en el Diseño (Stigliani, Corley & Gioia)","familia":"Analisis Formal","categoria":"Induccion comparativa desde datos abiertos","subcategoria":"Conceptualizacion","ideal_para":"Cerrar la brecha entre la academia y l o real) durante un período de seis meses para evaluar la viabilidad de los postulados.","NC",[],"NA","NA","A"],[19,"Iterar sobre los postulados basándose en la retroalimentación (por ejemplo, refinar el Postulado 3 para enfatizar el papel de las relaciones entre pares).","ABD",[],"NA","NA","A"],[20,"Compartir el modelo con profesores de teoría organizacional para obtener retroalimentación experta y refinar el marco teórico.","ABD",[],"NA","NA","A"]]},{"id":"sintesis","t":[[21,"Integrar los hallazgos de las tres organizaciones y la retroalimentación de expertos para refinar la MVT y convertirla en un marco más accionable y escalable.","ESQ",[],"NA","NA","A"],[22,"Articular el modelo de 'design theorizing' de 4 fases (Resonating, Reframing, Reimagining, Realizing) como un enfoque sistemático para construir teorías relevantes.","ESQ",[],"NA","NA","A"],[23,"Redactar el artículo académico que presenta el enfoque, incluyendo la justificación teórica, la descripción del proceso y un ejemplo de aplicación.","ARG",[],"NA","NA","A"]]},{"id":"adicional","t":[[24,"Reconocer que el proceso de design theorizing es iterativo y recursivo, no lineal, y que los investigadores deben ciclar entre las fases para refinar sus ideas.","MEM",[],"NA","NA","A"],[25,"Validar el enfoque con pares académicos y profesionales para asegurar su relevancia y aplicabilidad.","CAL",[],"NA","NA","A"],[26,"Discutir las condiciones límite del enfoque (adecuado para problemas complejos y ambiguos, requiere acceso a retroalimentación rica, etc.) y las implicaciones para la práctica académica.","ARG",[],"NA","NA","A"]]}],"estudio":{"titulo":"Thinking Theoretically: Developing a Design-Centered Approach to Organizational Theorizing","autores":["Ileana Stigliani","Kevin G Corley","Dennis Gioia"],"anio":"2025","tipo":"paper","url":"https://doi.org/10.1177/10564926251377740","origen":"DOI detectado en el PDF aportado","confianza":"alta","notas":"El texto es un artículo conceptual que propone un método, no un est         <script>/* ===== Estado y utilidades ===== */
const $ = s => document.querySelector(s);

const nz = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const root = document.documentElement;
const dark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
const col = a => a[dark() ? 1 : 0];
const fc = f => col(J[f].c), cc = (f, c) => col(J[f].cats[c].c);
const sc = (f, c, s) => { const k = J[f]?.cats[c]; return k ? col(k.subs[s] || k.c) : '#8267e2'; };
const ICO = { moon: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>', sun: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' };
const NET = '<svg class="i" style="width:2.4rem;height:2.4rem" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 7l3 3M17 7l-3 3M7 17l3-3M17 17l-3-3"/></svg>';

function motif(id) {
  let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const r = n => { h = (h * 1103515245 + 12345) >>> 0; return (h >>> 8) % n; }; let s = '';
  for (let i = 0; i < 6; i++) { const x = 15 + r(70), y = 15 + r(70), R = 6 + r(16); s += i % 3 ? `<circle cx="${x}" cy="${y}" r="${R}" style="fill:none;stroke:var(--pri);stroke-width:2"/>` : `<circle cx="${x}" cy="${y}" r="${R / 2.2}" style="fill:var(--pri);opacity:.55"/>`; }
  return `<svg viewBox="0 0 100 100">${s}</svg>`;
}
const pic = m => m.img ? `<img src="${m.img}" alt="" decoding="async">` : motif(m.id);
const bar = (r, cls = '') => `<div class="bar ${cls}">${ET.map(e => r[e.id] ? `<i style="width:${100 * r[e.id] / r.total}%;background:${e.c}" title="${e.n}: ${r[e.id]}"></i>` : '').join('')}</div>`;

/* ===== Navegación jerárquica: landing > categoría > subcategoría > métodos ===== */
function pills(f, c, s, click) {
  const p = (t, color, go) => click ? `<button class="pl" style="--c:${color}" data-go="${go}">${esc(t)}</button>` : `<span class="pl" style="--c:${color}">${esc(t)}</span>`;
  let h = click ? '<button class="pl" data-go="0">Inicio</button>' : '';
  if (f) h += (h ? '<i>›</i>' : '') + p(J[f].nombre, fc(f), 1);
  if (c) h += '<i>›</i>' + p(c, cc(f, c), 2);
  if (s) h += '<i>›</i>' + p(s, sc(f, c, s), 3);
  return `<div class="pills">${h}</div>`;
}
function card(m) {
  const r = m.res;
  return `<button class="mc" data-id="${m.id}" style="--c:${sc(m.familia, m.categoria, m.subcategoria)}"><div class="top"><div class="th">${pic(m)}</div><div><h3>${esc(m.nombre)}</h3><small>${esc(m.subcategoria)}</small></div></div>${r.total ? bar(r) : ''}<div class="meta"><span>${r.total || '—'} tareas</span><span>confianza ${m.estudio.confianza}</span></div></button>`;
}
function view() {
  const q = nz(S.q); let h = '';
  if (q) {
    const r = M.filter(m => nz([m.nombre, m.ideal_para, m.estudio.titulo, m.subcategoria, m.categoria].join(' ')).includes(q));
    h = `<div class="pills"><span class="pl">${r.length} resultados</span></div><div class="grid">${r.map(card).join('')}</div>${r.length ? '' : '<p class="none">Sin resultados.</p>'}`;
  } else if (!S.fam) {
    h = `<div class="grid">${Object.keys(J).map(f => `<button class="lv" data-fam="${f}" style="--c:${fc(f)}"><div class="tile">${NET}</div><h2>${J[f].nombre}</h2><p>${J[f].d}</p><span class="bdg">${M.filter(m => m.familia == f).length} Métodos</span></button>`).join('')}</div>`;
  } else {
    h = pills(S.fam, S.cat, S.sub, true);
    const inF = M.filter(m => m.familia == S.fam);
    if (!S.cat) {
      h += `<div class="grid">${Object.keys(J[S.fam].cats).map(c => { const ms = inF.filter(m => m.categoria == c); return `<button class="lv" data-cat="${esc(c)}" style="--c:${cc(S.fam, c)}"><h2>${esc(c)}</h2><p>${J[S.fam].cats[c].d}</p><span class="bdg">${ms.length} métodos en ${new Set(ms.map(m => m.subcategoria)).size} categorías</span></button>`; }).join('')}</div>`;
    } else if (!S.sub) {
      const ms = inF.filter(m => m.categoria == S.cat), subs = [...new Set(ms.map(m => m.subcategoria))];
      h += `<div class="grid">${subs.map(s => `<button class="lv" data-sub="${esc(s)}" style="--c:${sc(S.fam, S.cat, s)}"><h2>${esc(s)}</h2><p>${SD[s] || ''}</p><span class="bdg">${ms.filter(m => m.subcategoria == s).length} Métodos</span></button>`).join('')}</div>`;
    } else {
      h += `<div class="grid">${inF.filter(m => m.categoria == S.cat && m.subcategoria == S.sub).map(card).join('')}</div>`;
    }
  }
  $('#view').innerHTML = h;
}

/* ===== Overlay de método ===== */
function legend(m) {
  const r = m.res, cnt = {}; m.etapas.forEach(e => e.t.forEach(t => cnt[t[2]] = (cnt[t[2]] || 0) + 1));
  return (m.src === 'heuristica' ? '<div class="warn">Etiquetas provisionales por reglas de palabras clave. Ejecuta classify_tasks.py (DeepSeek) para clasificarlas.</div>' : '') +
    `<div class="lab">Etapas del análisis (tareas por etapa)</div><div class="chips">${ET.filter(e => r[e.id]).map(e => `<span class="sg" style="--c:${e.c}"><i></i>${e.n} <b>${r[e.id]}</b></span>`).join('')}</div>${bar(r, 'big')}` +
    '<p class="cap">Pasa el cursor (o toca) un círculo para ver la tarea. Un punto de color en el borde indica recolección de datos.</p>';
}

function footer(m) {
  const r = m.res, cnt = {}; m.etapas.forEach(e => e.t.forEach(t => cnt[t[2]] = (cnt[t[2]] || 0) + 1));
  return  `<div class="lab">Tipo de tarea (filtro)</div><div class="chips">${Object.keys(TP).filter(k => cnt[k]).map(k => `<button class="chip" data-tf="${k}" style="--c:${TP[k].c}" title="${esc(TP[k].d)}"><i></i>${TP[k].n} <b>${cnt[k]}</b></button>`).join('')}</div>`;
}
function flow(m) {
  if (!m.etapas.length) return '<p class="none">El texto del estudio no permitió reconstruir los pasos del procedimiento.</p>';
  const AR = '<svg class="arr" viewBox="0 0 40 12"><path d="M0 6H34M28 1L35 6L28 11"/></svg>'; let i = 0;
  const nodo = `<div class="node" style="--i:0"><h4>Datos de entrada</h4><p>Datos recolectados (filtro)</p><div class="chips">${m.entradas.length ? m.entradas.map(e => `<button class="chip" data-ef="${e.id}" style="--c:${DT[e.id].c}"><span><i></i> ${DT[e.id].n}</span><b>${e.n}</b></button>`).join('') : '<small>Sin recolección explícita.</small>'}</div></div>`;
  const cl = {};
  m.etapas.forEach((et, si) => {
    i++; const g = E[et.id];
    cl[et.id] = `<div class="col" style="--i:${i}"><div class="ch" style="--c:${g.c}"><b>${g.n}</b><small>${et.t.length}</small></div><div class="dots">${et.t.map((t, k) => `<button class="dot${t[3].length ? ' hd' : ''}" data-s="${si}" data-k="${k}" style="--c:${TP[t[2]].c}${t[3].length ? ';--d:' + DT[t[3][0]].c : ''}">${t[0]}</button>`).join('')}</div></div>`;
  });
  const p = [nodo]; ['preparacion', 'exploracion'].forEach(k => cl[k] && p.push(cl[k]));
  const a = cl.analisis, s = cl.sintesis;
  if (a && s) p.push(`<div class="loop" style="--i:${i}"><span class="ll">↻ Retroalimentación continua</span>${a}<svg class="lo" viewBox="0 0 40 90"><path d="M4 28C12 8 30 8 36 24M30 19L36 25L38 17"/><path d="M36 62C28 82 10 82 4 66M10 71L4 65L2 73"/></svg>${s}</div>`);
  else [a, s].forEach(x => x && p.push(x));
  cl.adicional && p.push(cl.adicional);
  return p.join(AR);
}
function openM(id) {
  const m = S.m = M.find(x => x.id == id); S.tf = new Set(); S.ef = null; S.pin = null;
  const e = m.estudio, au = e.autores.length > 2 ? e.autores[0] + ' et al.' : e.autores.join(', ');
  $('#sheet').innerHTML = `<div class="sh-top"><div>${pills(m.familia, m.categoria, m.subcategoria, false)}<div class="ttl"><div class="th">${pic(m)}</div><h2>${esc(m.nombre)}</h2></div></div><button class="ib" id="x" aria-label="Cerrar"><svg class="i" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
<div class="two"><section class="ideal"><h3>Ideal para</h3><p>${esc(m.ideal_para)}</p></section>
<section class="ideal"><h3>Estudio de referencia</h3><p class="st-t">${esc(e.titulo)}</p><p class="st-a">${esc(au)}${e.anio ? ' · ' + e.anio : ''}${e.tipo ? ' · ' + esc(e.tipo) : ''}<span class="cf ${e.confianza}">confianza ${e.confianza}</span></p>${e.url ? `<a class="lnk" href="${esc(e.url)}" target="_blank" rel="noopener">Abrir estudio ↗</a>` : '<small>Sin enlace disponible</small>'}<p class="note" title="${esc(e.notas)}">${esc(e.origen)}.${e.confianza != 'alta' && e.notas ? ' ' + esc(e.notas.slice(0, 160)) + (e.notas.length > 160 ? '…' : '') : ''}</p></section></div>
<section class="fb"><h3>Flujo del método</h3>${legend(m)}<div class="track go" id="fl">${flow(m)}</div>${footer(m)}</section>`;
  $('#ov').classList.add('open'); $('#ov').scrollTop = 0; document.body.style.overflow = 'hidden'; $('#x').focus();
}
function closeM() { $('#ov').classList.remove('open'); document.body.style.overflow = ''; hideTip(); S.pin = null; }

/* ===== Filtros (sin re-render) y tooltip único ===== */
function applyF() {
  document.querySelectorAll('[data-tf]').forEach(b => b.classList.toggle('on', S.tf.has(b.dataset.tf)));
  document.querySelectorAll('[data-ef]').forEach(b => b.classList.toggle('on', S.ef === b.dataset.ef));
  document.querySelectorAll('.dot').forEach(b => { const t = S.m.etapas[b.dataset.s].t[b.dataset.k]; b.classList.toggle('off', !((!S.tf.size || S.tf.has(t[2])) && (!S.ef || t[3].includes(S.ef)))); });
}
const tip = $('#tip'), canHover = matchMedia('(hover:hover)').matches;
function showTip(b) {
  const et = S.m.etapas[b.dataset.s], t = et.t[b.dataset.k], tp = TP[t[2]];
  const ch = (c, n) => `<span class="chip on" style="--c:${c}">${esc(n)}</span>`;
  tip.innerHTML = `<div class="tt"><b>Paso ${t[0]}</b> · ${E[et.id].n}</div><p>${esc(t[1])}</p><div class="chips">${ch(tp.c, tp.n)}${t[4] != 'NA' ? ch('#ec4899', 'Narrativa ' + S.D.narr[t[4]].toLowerCase()) : ''}${t[5] != 'NA' ? ch('#f59e0b', 'Tono ' + S.D.tonos[t[5]].toLowerCase()) : ''}${t[3].map(d => ch(DT[d].c, DT[d].n)).join('')}${t[6] == 'B' && t[2] != 'NC' ? ch('#6b7280', 'confianza baja') : ''}</div>`;
  tip.style.display = 'block';
  const r = b.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;

}
function hideTip() { tip.style.display = 'none'; }

/* ===== Eventos (delegación) ===== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-id],[data-fam],[data-cat],[data-sub],[data-go],#x,[data-tf],[data-ef],.dot');
  if (!t) { if (e.target.id == 'ov') closeM(); else if (S.pin) { hideTip(); S.pin = null; } return; }
  const d = t.dataset;
  if (d.id) openM(d.id);
  else if (d.fam) { S.fam = d.fam; S.cat = S.sub = null; view(); scrollTo(0, 0); }
  else if (d.cat) { S.cat = d.cat; S.sub = null; view(); }
  else if (d.sub) { S.sub = d.sub; view(); }
  else if (d.go) { const n = +d.go; if (n < 1) S.fam = null; if (n < 2) S.cat = null; if (n < 3) S.sub = null; view(); }
  else if (t.id == 'x') closeM();
  else if (d.tf) { S.tf.has(d.tf) ? S.tf.delete(d.tf) : S.tf.add(d.tf); applyF(); }
  else if (d.ef) { S.ef = S.ef == d.ef ? null : d.ef; applyF(); }
  else if (t.classList.contains('dot') && !canHover) { if (S.pin === t) { hideTip(); S.pin = null; } else { S.pin = t; showTip(t); } }
});
document.addEventListener('pointerover', e => { const b = canHover && e.target.closest?.('.dot'); if (b) showTip(b); });
document.addEventListener('pointerout', e => { if (canHover && e.target.closest?.('.dot')) hideTip(); });
document.addEventListener('focusin', e => { const b = e.target.closest?.('.dot'); if (b) showTip(b); });
document.addEventListener('focusout', e => { if (e.target.closest?.('.dot')) hideTip(); });
document.addEventListener('scroll', hideTip, true);
document.addEventListener('keydown', e => { if (e.key == 'Escape' && $('#ov').classList.contains('open')) closeM(); });
let tm; $('#q').addEventListener('input', e => { clearTimeout(tm); tm = setTimeout(() => { S.q = e.target.value; view(); }, 150); });
const tb = $('#th'), sync = () => tb.innerHTML = dark() ? ICO.sun : ICO.moon;
tb.onclick = () => { root.dataset.theme = dark() ? 'light' : 'dark'; sync(); if (M) { view(); if ($('#ov').classList.contains('open')) openM(S.m.id); } };
sync();

/* ===== Arranque: datos embebidos o methods_app.json; mensaje claro si no hay ===== */
function boot(d) { S.D = d; ET = d.etapas; E = Object.fromEntries(ET.map(e => [e.id, e])); TP = d.tipos; DT = d.datos; M = d.metodos; J = d.jer; SD = d.subdesc; view(); }
(async () => {
